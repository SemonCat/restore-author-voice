id: restore-author-voice-positive-voice-conflict
name: Surface a material venue and voice conflict
description: Irreconcilable required venue and voice rules should trigger one bounded clarification instead of silent override.
tags:
  - positive-trigger
  - voice-composition
  - conflict
inputs:
  prompt: |
    這是 eval，不要使用工具。我要重寫 release note，但兩套規則都標成 required，而且不要替我決定衝突：

    Repo venue：禁止 emoji，每項變更只能一行。
    Brand voice：每篇必須用 🎉 開頭，並用三句敘事鋪陳每項變更。

    內容：v2.5 將 retry 預設值從 2 改成 3。
expected:
  should_trigger: true
graders:
  - type: code
    name: asks-only-on-material-conflict
    config:
      assertions:
        - "'衝突' in output or ('repo' in output.lower() and 'brand' in output.lower())"
        - "'優先' in output or '選擇' in output or '指定' in output"
        - "len(tool_calls) <= 1"
